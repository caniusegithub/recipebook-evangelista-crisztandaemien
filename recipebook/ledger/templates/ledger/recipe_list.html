{% extends "ledger/base.html" %}
{% block title %}Recipe Book{% endblock %}

{% block content %}
<h1>All Recipes</h1>

<form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Logout</button>
</form>

<ul>
    {% for recipe in recipes %}
    <li>
        <a href="{% url 'recipe_detail' recipe.id %}">{{ recipe.name }}</a> 
    </li>
    {% endfor %}
</ul>
{% endblock %}
